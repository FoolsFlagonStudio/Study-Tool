[project]
name = "studytool"
version = "0.1.0"
description = "Generated practice quizzes with notes, by topic - starting with precalculus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["studytool", "studytool.core", "studytool.generators"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
